name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * *' # nightly audit of all games (05:17 MSK)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build all games and templates
        run: npm run build:all
      - name: Yandex requirements audit
        run: npm run audit -- --all
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (desktop + mobile)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
